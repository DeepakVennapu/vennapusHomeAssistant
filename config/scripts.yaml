goodnight:
  alias: Goodnight
  sequence:
    - action: lock.lock
      target:
        entity_id: lock.main_door
    - action: cover.close_cover
      target:
        entity_id: cover.double
    - action: cover.close_cover
      target:
        entity_id: cover.single
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.deevana2_alarm
  mode: single

good_morning:
  alias: Good Morning
  sequence:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.deevana2_alarm
    - action: lock.unlock
      target:
        entity_id: lock.main_door
  mode: single

leave_home:
  alias: Leave Home
  sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.double
    - action: cover.close_cover
      target:
        entity_id: cover.single
    - action: lock.lock
      target:
        entity_id: lock.main_door
    - action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.deevana2_alarm
  mode: single

leave_home_resident_staying:
  alias: Leave Home (Resident Staying)
  sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.double
    - action: cover.close_cover
      target:
        entity_id: cover.single
    - action: lock.lock
      target:
        entity_id: lock.main_door
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.deevana2_alarm
  mode: single

arrive_home:
  alias: Arrive Home
  sequence:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.deevana2_alarm
    - action: cover.open_cover
      target:
        entity_id: cover.double
  mode: single

close_all_garages:
  alias: Close All Garages
  sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.double
    - action: cover.close_cover
      target:
        entity_id: cover.single
  mode: single

lock_up:
  alias: Lock Up
  sequence:
    - action: lock.lock
      target:
        entity_id: lock.main_door
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.deevana2_alarm
  mode: single
